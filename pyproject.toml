[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "ccl_log",
]

[project]
name = "ccl_log"
version = "0.2.1"
authors = [
  { name="Alex Caithness", email="research@cclsolutionsgroup.com" },
]
description = ""
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
]
keywords = ["logging"]
dependencies = [
]

[project.urls]
Homepage = "https://github.com/cclgroupltd/ccl-log"
Issues = "https://github.com/cclgroupltd/ccl-log/issues"